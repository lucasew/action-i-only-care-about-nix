name: Autorelease

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - release

jobs:
  autorelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          version: 2026.3.5

      - name: Install dependencies
        run: mise run install

      - name: Run codegen
        run: mise run codegen

      - name: PR if Difference
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b chore/codegen-${{ github.sha }}
            git add -A
            git commit -m "chore: update generated code"
            git push origin chore/codegen-${{ github.sha }} || true
            gh pr create --title "chore: update generated code" --body "Autogenerated PR for codegen changes." --head chore/codegen-${{ github.sha }} --base main || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI
        run: mise run ci

      - name: Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: .
